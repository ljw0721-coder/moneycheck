name: Image metadata
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify article images and their reviewed rights
        run: node scripts/verify-image-metadata.mjs
      - name: Exercise image generation and deployment regressions
        run: node --test tests/image-metadata.test.mjs
      - name: Preserve approved advertising metadata
        run: node scripts/verify-ads.mjs
